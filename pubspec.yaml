name: travel_booking_app
description: Aplikasi pemesanan travel mobil

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.0.5
  intl: ^0.18.1
  flutter_typeahead: ^5.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  webview_flutter: ^4.4.2
  url_launcher: ^6.2.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  google_maps_flutter: ^2.5.0
  permission_handler: ^11.0.1
  image_picker: ^1.0.4
  # Firebase for push notifications
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.9
  flutter_local_notifications: ^17.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/app_icon.png
    - assets/icons/icon_untuk_hantar_pulang.png
    - assets/icons/icon_home_tp_bg.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"
